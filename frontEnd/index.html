<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assists/css/Emp.css">
</head>
<body>
      <div class="container">
        <header>
            <div>
                <h2>Employee Form</h2>
                <p class="subtitle">Please fill in your details below.</p>
            </div>
            <div class="logo">
                <img src="./assists/images/Atthah.png" alt="">
            </div>
        </header>

   <form action="">
        <!-- 1. Personal Details -->
        <section>
            <h3>1. Personal Details</h3>
            <div class="grid">
                <div>
                    <label>Full Name</label>
                    <input type="text" placeholder="Your Name" class="full-name">
                </div>
                <div>
                    <label>Email Address</label>
                    <input type="email" placeholder="Your Email" class="email">
                </div>
                <div>
                    <label>Phone Number</label>
                    <input type="number" placeholder="Your Phone no." class="phone">
                </div>
                <div class="full">
                    <label>Remark</label>
                    <textarea placeholder="Your Remarks" class="remark"></textarea>
                </div>
            </div>
        </section>

        <!-- 2. Education -->
        <section id="Education-section">
            <h3>2. Education</h3>
            <div class="grid">
                <div>
                    <label>10th Passing Year</label>
                    <select class="year-select year-10">

                    </select>
                </div>
                <div>
                    <label>12th Passing Year</label>
                    <select class="year-select year-12">

                    </select>
                </div>
                <div>
                    <label>Post Graduation Degree</label>
                    <input type="text" placeholder="e.g. M.Tech, MBA" class="pg-degree">
                </div>
                <div>
                    <label>Post Graduation Year</label>
                    <select class="year-select pg-year">

                    </select>
                </div>
                <div>
                    <label>Graduation Degree</label>
                    <input type="text" placeholder="e.g. B.Tech, B.Sc" class="grad-degree">
                </div>
                <div>
                    <label>Graduation Year</label>
                    <select class="year-select grad-year">

                    </select>
                </div>
            </div>
        </section>

        <!-- 3. Certificates -->
        <!-- <section id="Certificates-section">
            <h3>3. Certificates & Documents</h3>
            <div class="upload-box">
                <input type="file">
                <p>Click to upload certificates or resume<br><small>(Images, PDF allowed)</small></p>
            </div>
        </section> -->

        <!-- 4. Employment History -->
        <section id="employment-section">
            <h3>3. Employment History</h3>
        </section>

        <button class="submit-btn">Submit</button>
    </div>
    </form>

    <script src="./assists/js/emp.js"></script>
</body>
</html>

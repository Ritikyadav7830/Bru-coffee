<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Js</title>
    <link rel="stylesheet" href="./assists/css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

<body>

    <div class="container SignIn ">

            <div class="img-container">
                <img src="./assists/images/Atthah.png" alt="">
            </div>
        </header>
        <p id="pera">Please login to access the dashboard </p>

        <div class="input-bx">
            <label for="Email" id="Email-label">Email address</label>
            <input type="email" name="Email" id="Email">
        </div>
        <div class="input-bx">
            <label for="Password">Password</label>
            <input type="password" name="Password" id="Password">
        </div>
        <button class="SignIn-btn" type="button">Sign In</button>
    </div>



    <script src="./assists/js/login.js"></script>

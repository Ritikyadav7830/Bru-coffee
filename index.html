<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bru Coffee</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/media.css">
</head>

<body>

    <section class="header">
        <div class="logo-container">
            <div class="bru-logo-container">
                <img src="assets/image/1st-page/bru.logo.png" alt="">
            </div>


            <div class="bru-minder-logo-container">
                <img src="assets/image/2nd-page/bru-minder.png" alt="">
            </div>

            <div class="gemini-logo-container">
                <p>Powered by</p>
                <img src="assets/image/1st-page/gemini.logo.png" alt="">
            </div>

        </div>
    </section>



    <section class="page1 common-section ">

        <div class="container">

            <div class="hand-love-img">
                <img src="assets/image/1st-page/hand-love.png" alt="hand-love-img">
            </div>

            <div class="cup-img">
                <img src="assets/image/1st-page/cup.png" alt="cup-img">
            </div>

            <div class="bru-gold-img">
                <img src="assets/image/1st-page/bru-gold.png" alt="bru-gold-img">
            </div>

            <div class="squre-img">
                <img src="assets/image/1st-page/squre.png" alt="squre-img">
            </div>

            <div class="green-img">
                <img src="assets/image/1st-page/green-circle.png" alt="green-img">
            </div>




            <div class="bru-content">
                <div>
                    <h3>From in-your-dreams to IRL.</h3>
                    <p>Make your date come to life with Bru.</p>
                </div>
                <div>
                    <button id="page1-lessgo">lessgo!</button>
                </div>

            </div>


        </div>
    </section>

    <section class="page2 common-section d-none  ">

        <div class="data-container">

            <div class="absolute-img1">
                <img src="assets/image/2nd-page/biscuit.png" alt="biscuit">
            </div>
            <div class="absolute-img2">
                <img src="assets/image/2nd-page/biscuit2.png" alt="biscuit2">
            </div>
            <div class="absolute-img3">
                <img src="assets/image/2nd-page/yellow-circle.png" alt="yellow-circle">
            </div>
            <div class="absolute-img4">
                <img src="assets/image/2nd-page/cup.png" alt="cup">
            </div>
            <div class="absolute-img5">
                <img src="assets/image/2nd-page/couple.png" alt="couple">
            </div>


            <p id="pera1">Share you & your boo’s pic.</p>
            <div class="upload-container">
                <div class="upload-1">

                    <p id="pera-pic">Your image</p>

                    <div class="upload-img-1">
                        <img src="assets/image/2nd-page/upload.png" alt="">
                    </div>
                    <p id="pera2">Click to upload</p>
                    <p id="pera3">PNG, JPG</p>
                </div>
                <div class="upload-2">
                    <p id="pera-pic">Your boo's image</p>
                    <div class="upload-img-2">
                        <img src="assets/image/2nd-page/upload.png" alt="">
                    </div>
                    <p id="pera4">Click to upload</p>
                    <p id="pera5">PNG, JPG</p>
                </div>
            </div>


            <div class="form-container">
                <p id="pera6">What should we call you <br> and your boo?</p>
                <form action="#">
                    <input type="text" placeholder="Your name">
                    <input type="text" placeholder="Boo’s name">
                    <button type="submit" id="page2-next">Next</button>
                </form>
            </div>
        </div>


    </section>

    <section class="page3 common-section d-none ">

        <div class="page3-container">

            <div class="hand-love-img">
                <img src="assets/image/1st-page/hand-love.png" alt="hand-love-img">
            </div>

            <div class="cup-img">
                <img src="assets/image/1st-page/cup.png" alt="cup-img">
            </div>

            <div class="bru-gold-img">
                <img src="assets/image/1st-page/bru-gold.png" alt="bru-gold-img">
            </div>

            <div class="squre-img">
                <img src="assets/image/1st-page/squre.png" alt="squre-img">
            </div>

            <div class="green-img">
                <img src="assets/image/1st-page/green-circle.png" alt="green-img">
            </div>




            <div class="page3-content">
                
                    <h3>Add your dream destination</h3>
                  
                    <div class="select-bar">
                    <select class="select-input">
                        <option value="">Select your scene...</option>
                        <option value="v1">Watching the Northern Lights</option>
                        <option value="v2">Coffee at a Parisian Cafe</option>
                        <option value="v3">Walk on the Beach at a sunset</option>
                        <option value="v4">Scenic Mountain</option>
                        <option value="v5">Picnic at a Beautiful Garden</option>
                        <option value="v6">Walk in the Tulip Fields</option>
                        <option value="v7">Together at the Giza Pyramids</option>
                        <option value="v8">Coral Reefs</option>
                        <option value="v9">Greek Santorini Village</option>
                    </select>
                </div>


                <div class="page3-btn">
                    <button id="page3-back">Back</button>
                    <button id="page3-next">Next</button>
                </div>

            </div>


        </div>
    </section>

        <section class="page4 common-section d-none ">

        <div class="page3-container">

            <div class="hand-love-img">
                <img src="assets/image/1st-page/hand-love.png" alt="hand-love-img">
            </div>
            <div class="cup-img">
                <img src="assets/image/1st-page/cup.png" alt="cup-img">
            </div>

            <div class="bru-gold-img">
                <img src="assets/image/1st-page/bru-gold.png" alt="bru-gold-img">
            </div>

            <div class="squre-img">
                <img src="assets/image/1st-page/squre.png" alt="squre-img">
            </div>

            <div class="green-img">
                <img src="assets/image/1st-page/green-circle.png" alt="green-img">
            </div>




            <div class="page3-content">
                
                    <h3>Set your vibe!</h3>
                  
                    <div class="select-bar">
                    <select class="select-input" id="page4-select-input">
                        <option value="">Select a style...</option>
                        <option value="v1">Comicbook</option>
                        <option value="v2">Animated</option>
                        <option value="v3">Photorealistic</option>
                        <option value="v4">Surprise me</option>
                    </select>
                </div>


                <div class="page3-btn">
                    <button id="page4-back">Back</button>
                    <button id="page4-generate">Generate</button>
                </div>

            </div>


        </div>
    </section>

    <script src="assets/js/app.js"></script>
</body>

</html>
